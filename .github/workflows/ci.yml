name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Check package consumers
        run: pnpm run check:consumers

      - name: Audit dependencies
        run: pnpm audit

      - name: Test with coverage
        run: pnpm run test:coverage

      - name: Benchmark regression check
        if: matrix.node-version == 22
        run: pnpm run bench:check

  visualization:
    name: Visualization (build + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/visualization/package-lock.json
      - run: npm ci
        working-directory: examples/visualization
      - run: npm run build
        working-directory: examples/visualization
      - run: npm audit
        working-directory: examples/visualization

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [test, visualization]
    if: always()
    steps:
      - name: Verify required jobs
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.visualization.result }}" != "success" ]; then
            echo "CI did not pass."
            exit 1
          fi
